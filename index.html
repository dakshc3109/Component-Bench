<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#4f46e5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Component Bench: live, copy-ready UI elements</title>
<meta name="description" content="Interact with beautiful UI elements in a live preview, then copy the HTML, CSS and JS. No dependencies, no build step.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div class="topin">
    <div class="brand"><span class="logo"></span>Component Bench</div>
    <div class="tools"><input id="q" type="search" placeholder="Search components (press /)" aria-label="Search components"></div>
    <button class="theme" id="theme" type="button">Theme</button>
  </div></header>
<div class="wrap">
  <section class="hero">
    <h1>UI elements you can feel before you copy them.</h1>
    <p class="sub">Hover, click and tilt every component in a live preview. Then take the exact HTML, CSS and JS with one click.</p>
    <div class="stats" id="stats"></div>
  </section>
  <nav class="toc" id="toc"></nav>
  <main id="list"></main>
  <p id="empty" hidden>No components match. Try another search or filter.</p>
  <footer class="foot">Component Bench. Copy it, tweak it, ship it.</footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="script.js"></script>
</body>
</html>
