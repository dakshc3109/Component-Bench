<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <title>Component Bench: live, copy-ready UI elements</title>
    <meta
      name="description"
      content="Interact with beautiful UI elements in a live preview, then copy the HTML, CSS and JS. No dependencies, no build step."
    >
    <meta name="theme-color" content="#090A0F">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="dock">
      <div class="dock-in">
        <div class="brand">
          <span class="logo"></span>
          <span class="brand-name">Component Bench</span>
          <span class="ver">v3.0</span>
        </div>

        <label class="omni">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
          </svg>
          <input
            id="q"
            type="search"
            placeholder="Search components"
            aria-label="Search components"
            autocomplete="off"
          >
          <kbd>⌘ + K</kbd>
        </label>

        <div class="dock-r">
          <button class="ic" id="theme" type="button" aria-label="Toggle theme"></button>
          <button class="saved" id="favbtn" type="button" aria-label="Show saved components">
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>
            </svg>
            <span>Saved</span>
            <b id="favcount">0</b>
          </button>
        </div>
      </div>
    </header>

    <div class="scroll-progress" aria-hidden="true">
      <span></span>
    </div>

    <div class="wrap">
      <section class="hero">
        <h1>UI elements you can feel before you copy them.</h1>
        <p class="sub">
          Hover, click and tilt every component in a live preview. Then take the exact HTML, CSS and
          JS with one click.
        </p>
        <div class="stats" id="stats"></div>
      </section>

      <nav class="toc" id="toc"></nav>
      <main id="list" class="grid"></main>
      <p id="empty" hidden>No components match. Try another search or filter.</p>

      <footer class="foot">Component Bench. Copy it, tweak it, ship it.</footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
